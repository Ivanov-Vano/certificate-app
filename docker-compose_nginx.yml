version: '3.8'

services:
  # PHP-FPM контейнер
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    container_name: certificate-php
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=Docker
    networks:
      - app-network
    restart: unless-stopped

  # Nginx контейнер
  nginx:
    image: nginx:alpine
    container_name: certificate-nginx
    ports:
      - "${APP_PORT:-80}:80"  # Временно на другом порту для тестирования
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL
  pgsql:
    image: postgres:17
    container_name: certificate-pgsql
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"  # Другой порт, чтобы не конфликтовать с возможным локальным PostgreSQL
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_ROOT_PASSWORD: rootpassword  # Для совместимости
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      # Опционально: скрипт для создания тестовой БД (как в Sail)
      - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge
    name: web_network  # Используем существующую сеть

volumes:
  pgsql-data:
