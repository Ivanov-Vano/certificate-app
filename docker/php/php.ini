[PHP]
; Настройки загрузки файлов
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

; Таймауты для больших файлов
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Остальные полезные настройки
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Настройки сессий
session.gc_maxlifetime = 1200
